<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction - Profile</title>
    <link rel="icon" href="favicon.png">
    <link href="/style.css" rel="stylesheet" type="text/css" media="all">
  </head> 
  <body>
    <!-- Top Black Marquee with Orange Text -->
    <div class="marquee-container">
      <marquee behavior="scroll" direction="left" scrollamount="6">
        Unda Construction....Please Be Patient....
      </marquee>
    </div>

    <div id="page-container">
      <!-- Centered Content Area -->
      <div id="content">
        <!-- Big Logo in the Center -->
        <div class="logo-container">
          <img src="23.png" alt="Skyytopia Logo" class="main-logo">
        </div>

        <!-- Home Button Redirecting to Homepage.html -->
        <div class="button-container">
          <a href="Homepage.html" class="home-btn">Home</a>
        </div>
      </div>
    </div>

    <style>
      body {
         background-color: #6c6b3f;
         font-family: "Menlo", monospace;
         margin: 0;
         padding: 0;
         height: 100vh;
         display: flex;
         flex-direction: column;
         overflow: hidden;
      }

      /* Marquee Styling */
      .marquee-container {
        width: 100%;
        background-color: black;
        color: orange;
        font-size: 2.5vh;
        font-weight: bold;
        padding: 12px 0;
        z-index: 100;
        box-sizing: border-box;
      }

      #page-container {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      #content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        text-align: center;
        width: 100%;
      }

      /* Big Logo Styling */
      .logo-container {
        width: 100%;
        text-align: center;
      }

      .main-logo {
        max-width: 350px;
        width: 60%;
        height: auto;
        display: inline-block;
        filter: drop-shadow(4px 4px 0px rgba(0, 0, 0, 0.3));
      }

      /* Home Button Styling */
      .button-container {
        margin-top: 10px;
      }

      .home-btn {
        display: inline-block;
        border: 3px solid black;
        background-color: white;
        color: black;
        padding: 12px 30px;
        font-size: 2.2vh;
        font-weight: bold;
        text-decoration: none;
        border-radius: 4px;
        font-family: "Menlo", monospace;
        transition: all 0.2s ease-in-out;
      }

      .home-btn:hover {
        background-color: black;
        color: white;
        border-color: black;
      }

      @media screen and (max-width: 700px) {
        .marquee-container {
          font-size: 2vh;
        }
        .main-logo {
          max-width: 240px;
        }
        .home-btn {
          font-size: 1.8vh;
          padding: 10px 24px;
        }
      }
    </style>
  </body>
</html>
