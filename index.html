<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amber Diaz</title>

<link rel="icon" href="favicon.png">

<style>

/* =========================
   PAGE
   ========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {

    background: #6f7045;

    font-family: Arial, Helvetica, sans-serif;

    overflow: hidden;

}


/* =========================
   BACKGROUND
   ========================= */

#background {

    position: fixed;

    inset: 0;

    z-index: 0;

}


/* =========================
   LOW POLY AMBER
   ========================= */

.amber-character {

    position: absolute;

    left: 50%;

    bottom: 85px;

    transform: translateX(-50%);

    width: 260px;

    cursor: pointer;

    z-index: 50;

    user-select: none;

    transition:
        transform 0.15s ease,
        filter 0.15s ease;

}


.amber-character img {

    display: block;

    width: 100%;

    height: auto;

    pointer-events: none;

}


/* Hover */

.amber-character:hover {

    transform:
        translateX(-50%)
        scale(1.04);

}


/* =========================
   CLICK / TAZE ANIMATION
   ========================= */

.amber-character.tazed {

    animation:
        amberShake
        0.45s
        steps(2, end);

}


.amber-character.tazed img {

    animation:
        amberGlitch
        0.45s
        steps(2, end);

}


/* Shake */

@keyframes amberShake {

    0% {

        transform:
            translateX(-50%)
            rotate(0deg);

    }

    15% {

        transform:
            translateX(calc(-50% - 7px))
            rotate(-2deg);

    }

    30% {

        transform:
            translateX(calc(-50% + 8px))
            rotate(2deg);

    }

    45% {

        transform:
            translateX(calc(-50% - 6px))
            rotate(-2deg);

    }

    60% {

        transform:
            translateX(calc(-50% + 6px))
            rotate(2deg);

    }

    75% {

        transform:
            translateX(calc(-50% - 3px))
            rotate(-1deg);

    }

    100% {

        transform:
            translateX(-50%)
            rotate(0deg);

    }

}


/* Glitch */

@keyframes amberGlitch {

    0% {

        filter: none;

    }

    20% {

        filter:
            contrast(1.4)
            saturate(1.5);

    }

    40% {

        filter:
            hue-rotate(25deg)
            contrast(1.3);

    }

    60% {

        filter:
            brightness(1.3)
            contrast(1.5);

    }

    80% {

        filter:
            hue-rotate(-20deg);

    }

    100% {

        filter: none;

    }

}


/* =========================
   SPEECH BUBBLE
   ========================= */

.speech-bubble {

    position: absolute;

    left: 50%;

    top: -45px;

    transform:
        translateX(-50%)
        scale(0);

    background: white;

    color: black;

    border: 2px solid black;

    padding: 7px 12px;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 13px;

    font-weight: bold;

    white-space: nowrap;

    z-index: 10;

    opacity: 0;

    transition:
        transform 0.15s ease,
        opacity 0.15s ease;

}


/* Speech bubble tail */

.speech-bubble::after {

    content: "";

    position: absolute;

    left: 50%;

    bottom: -8px;

    width: 12px;

    height: 12px;

    background: white;

    border-right: 2px solid black;

    border-bottom: 2px solid black;

    transform:
        translateX(-50%)
        rotate(45deg);

}


/* Show bubble */

.amber-character.talking .speech-bubble {

    transform:
        translateX(-50%)
        scale(1);

    opacity: 1;

}


/* =========================
   ENTER BUTTON
   ========================= */

.enter-button {

    position: absolute;

    left: 50%;

    bottom: 25px;

    transform: translateX(-50%);

    z-index: 100;

    display: inline-block;

    padding: 6px 18px;

    background: white;

    color: black;

    border: 2px solid black;

    text-decoration: none;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;

    box-shadow: 3px 3px 0px black;

    transition:
        transform 0.1s ease,
        box-shadow 0.1s ease,
        background 0.1s ease;

}


/* Hover */

.enter-button:hover {

    background: black;

    color: white;

    transform:
        translateX(-50%)
        translateY(-2px);

    box-shadow: 3px 5px 0px black;

}


/* Click */

.enter-button:active {

    transform:
        translateX(-50%)
        translateY(2px);

    box-shadow: 1px 1px 0px black;

}


/* =========================
   MOBILE
   ========================= */

@media screen and (max-width: 700px) {

    .amber-character {

        width: 190px;

        bottom: 75px;

    }

    .speech-bubble {

        font-size: 11px;

    }

    .enter-button {

        bottom: 20px;

        font-size: 12px;

        padding: 5px 15px;

    }

}

</style>

</head>


<body>


<!-- =========================
     BACKGROUND
     ========================= -->

<div id="background"></div>


<!-- =========================
     LOW POLY AMBER
     ========================= -->

<div
    class="amber-character"
    id="amberCharacter"
>

    <div
        class="speech-bubble"
        id="speechBubble"
    ></div>

    <img
        src="lowpolymeee.png"
        alt="Amber"
    >

</div>


<!-- =========================
     ENTER PROFILE BUTTON
     ========================= -->

<a
    href="Homepage.html"
    class="enter-button"
>
    ENTER
</a>


<!-- =========================
     DON'T TAZE ME BRO SOUND
     ========================= -->

<audio
    id="tazeSound"
    preload="auto"
>

    <source
        src="donttazemebro.mp3"
        type="audio/mpeg"
    >

</audio>


<script>

/* =========================
   AMBER
   ========================= */

const amber =
    document.getElementById("amberCharacter");

const sound =
    document.getElementById("tazeSound");

const speech =
    document.getElementById("speechBubble");


/* =========================
   RANDOM THINGS AMBER CAN SAY
   ========================= */

const messages = [

    "yo",

    "why u clicking me",

    "HELLO????",

    "don't touch me",

    "wassup",

    "u found me",

    "girl...",

    "STOP 😭",

    "what do u want",

    "not again",

    "leave me alone",

    "lmao",

    "ayo",

    "who told u to click me"

];


/* =========================
   CLICK AMBER
   ========================= */

amber.addEventListener("click", function () {


    /* Pick random message */

    const randomMessage =
        messages[
            Math.floor(
                Math.random() * messages.length
            )
        ];


    speech.textContent =
        randomMessage;


    /* Reset animation */

    amber.classList.remove("tazed");

    amber.classList.remove("talking");


    /*
       Forces the browser to
       restart the animation.
    */

    void amber.offsetWidth;


    /* Start animation */

    amber.classList.add("tazed");

    amber.classList.add("talking");


    /* =========================
       PLAY SOUND
       ========================= */

    sound.currentTime = 0;

    sound.play().catch(function(error) {

        console.log(
            "Audio could not play:",
            error
        );

    });


    /* =========================
       HIDE SPEECH BUBBLE
       ========================= */

    setTimeout(function() {

        amber.classList.remove("talking");

    }, 1800);


});

</script>


</body>

</html>
