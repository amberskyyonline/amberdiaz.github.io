<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoW0rld</title>
    <link rel="icon" href="favicon.png">
    <link href="/style.css" rel="stylesheet" type="text/css" media="all">
  </head> 
  <body>
  <div id="page-container">
    
    <!-- Logo Container -->
    <div class="logo-container">
        <a href="index.html">
            <img src="22.png" alt="Skyytopia Logo" class="main-logo">
        </a>
    </div>

    <div id="content-wrap">
    </div> 

    <!-- Centered Content Grid -->
    <div id="content">
      <div class="gallery-grid">
        <div class="gallery">
          <div class="wistia_embed wistia_async_xxeetv5l4v" style="height:100%;width:100%;">&nbsp;</div>
          <div class="desc"></div>
        </div>

        <div class="gallery">
          <div class="wistia_embed wistia_async_w9v7ileovy" style="height:100%;width:100%;">&nbsp;</div>
          <div class="desc"></div>
        </div>

        <div class="gallery">
          <div class="wistia_embed wistia_async_kugfyw90yl" style="height:100%;width:100%;">&nbsp;</div>
          <div class="desc"></div>
        </div>

        <div class="gallery">
          <div class="wistia_embed wistia_async_3no9llex9m" style="height:100%;width:100%;">&nbsp;</div>
          <div class="desc"></div>
        </div>

        <div class="gallery">
          <div class="wistia_embed wistia_async_iqzu8jqp3b" style="height:100%;width:100%;">&nbsp;</div>
          <div class="desc"></div>
        </div>

        <div class="gallery">
          <div class="wistia_embed wistia_async_00qhk1cyaa" style="height:100%;width:100%;">&nbsp;</div>
          <div class="desc"></div>
        </div>
          
        <div class="gallery">
          <div class="wistia_embed wistia_async_w8k6bu221i" style="height:100%;width:100%;">&nbsp;</div>
          <div class="desc"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("drop")?.addEventListener("click", function(e) {
      document.getElementById("myDropdown")?.classList.toggle("show");
    });

    window.addEventListener("click", function(event) {
      if (!event.target.matches('.dropbtn')) {
        document.querySelectorAll(".dropdown-content.show")
          .forEach(openDropdown => openDropdown.classList.remove('show'))
      }
    });

    document.querySelectorAll('.video-thumb').forEach(video => {
      video.addEventListener('mouseenter', () => video.play());
      video.addEventListener('mouseleave', () => {
        video.pause();
        video.currentTime = 0;
      });
    });
  </script>

  <style>
    .logo-container {
        width: 100%;
        text-align: center;
        padding-top: 25px;
        z-index: 100;
        position: relative;
    }

    .main-logo {
        max-width: 140px;
        width: 100%;
        height: auto;
        display: inline-block;
        filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.15));
    }

    .navbar {  
      z-index: 99;
      position: relative;
      top: 10%;
      right: 0;
      width: 100%;
      background-color: black;
      color: white;
      text-align: center;
      vertical-align: middle;
      height: 9%;
      padding-top: 10px;
      padding-bottom: 10px;
    } 

    .gallery .wistia_embed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .video-thumb {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 100%;
      object-fit: cover;
      cursor: pointer;
    }

    #page-container {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #content-wrap {
      padding-bottom: 20px;
    }

    /* Perfectly center the video gallery wrapper horizontally and vertically */
    #content { 
      z-index: 99;
      width: 100%;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 0;
    }

    /* Grid configuration to lock perfect alignment and centering */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 340px);
      justify-content: center;
      gap: 40px;
      max-width: 1160px;
      width: 100%;
      margin: 0 auto;
    }

    .dropbtn {
      border: 2px solid black;
      background-color: white;
      color: black;
      padding: 10px 20px;
      font-size: 2.5vh;
      border-radius: 2px;
      cursor: url(custompointerfilename.png), auto;
      transition-duration: 0.0s;
      font-family: "Menlo";
    }

    .dropbtn:hover {
      background-color: black; 
      color: white;
    }

    .cursor {
      cursor: url(customcursorfilename.png), auto;
      height: 350px;
      width: 25%;
      left: 200px;
      position: absolute;
      z-index: 99;
    }

    .dropdown {
      position: relative;
      display: inline;
      cursor: url(customcursorfilename.png), auto; 
    }

    .dropdown-content {
      display: none;
      position: absolute;
      left: 0%;
      top: 10px;
      background-color: #fff;
      width: 93%;
      z-index: 1;
      margin-top: 20px;
    }

    .dropdown-content a {
      color: black;
      padding: 5px 5px;
      text-decoration: none;
      display: block;
    }

    hr.solid {
      border: 1px solid #fff;
    }

    .show {
      display: block;
    }

    .menu {
      padding: 5px;
      padding-top: 10px;  
    } 

    body {
       background: black;
       font-family: "Menlo";
       margin: 0;
    }

    .gallery {
      position: relative;
      width: 100%;
      height: 210px;
      border: none;
      margin: 0;
    }

    div.gallery:hover {
      border: none;
    }

    .gallery img {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 100%;
      object-fit: cover;
    }

    .desc {
      display: block;
      position: absolute;
      top: 105%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: white;
      overflow: visible;
      width: 100%;
    }

    @media screen and (max-width: 1100px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 320px);
      }
    }

    @media screen and (max-width: 700px) {
      .footer {  
        font-size: 1.5vh;
      }
      .dropbtn {
        font-size: 1.5vh;
      }
      .dropdown-content a {
        font-size: 1.5vh;
      }
      .gallery-grid {
        grid-template-columns: 1fr;
        padding: 0 20px;
      }
      .gallery {
        height: 200px;
      }
      .desc {
        font-size: 1.7vh;
      }
    }
  </style>
  <script src="https://fast.wistia.com/assets/external/E-v1.js" async></script>
</body>
</html>
