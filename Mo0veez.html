  <script>
    document.getElementById("drop")?.addEventListener("click", function(e) {
      document.getElementById("myDropdown")?.classList.toggle("show");
    });

    window.addEventListener("click", function(event) {
      if (!event.target.matches('.dropbtn')) {
        document.querySelectorAll(".dropdown-content.show")
          .forEach(openDropdown => openDropdown.classList.remove('show'))
      }
    });

    // Drag-to-scroll and Infinite Loop Mechanism
    const track = document.getElementById('marqueeTrack');
    let isDown = false;
    let startX;
    let scrollLeft;

    track.addEventListener('mousedown', (e) => {
      isDown = true;
      track.classList.add('active');
      startX = e.pageX - track.offsetLeft;
      scrollLeft = track.scrollLeft;
    });

    track.addEventListener('mouseleave', () => {
      isDown = false;
      track.classList.remove('active');
    });

    track.addEventListener('mouseup', () => {
      isDown = false;
      track.classList.remove('active');
    });

    track.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - track.offsetLeft;
      const walk = (x - startX) * 2; // Scroll speed multiplier
      track.scrollLeft = scrollLeft - walk;
    });

    // Touch support for mobile dragging
    track.addEventListener('touchstart', (e) => {
      isDown = true;
      startX = e.touches[0].pageX - track.offsetLeft;
      scrollLeft = track.scrollLeft;
    });

    track.addEventListener('touchend', () => {
      isDown = false;
    });

    track.addEventListener('touchmove', (e) => {
      if (!isDown) return;
      const x = e.touches[0].pageX - track.offsetLeft;
      const walk = (x - startX) * 2;
      track.scrollLeft = scrollLeft - walk;
    });

    // Seamless infinite wrap logic
    track.addEventListener('scroll', () => {
      const halfWidth = track.scrollWidth / 2;
      if (track.scrollLeft >= halfWidth) {
        track.scrollLeft -= halfWidth;
      } else if (track.scrollLeft <= 0) {
        track.scrollLeft += halfWidth;
      }
    });
  </script>

    .logo-container {

    #page-container {

    /* Infinite scrolling & draggable track */

      width: 100%;
      padding: 20px 50px;
      cursor: grab;
      user-select: none;

    .dropdown {

    body {

    /* Scaled down side-by-side gallery item dimensions */
    .gallery {
      position: relative;
      flex: 0 0 220px;
      height: 135px;
      border: none;
      margin: 0;
    }

    .gallery .wistia_embed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    div.gallery:hover {

    }

    .gallery img {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 100%;

    .desc {
      display: block;

      color: white;
      overflow: visible;
      width: 100%;
