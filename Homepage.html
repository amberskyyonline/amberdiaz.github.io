
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKYYUTOPIA</title>
    <link rel="icon" href="favicon.png">
   <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #6c6b3f;
        font-family: Verdana, Arial, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        padding: 10px 0;
    }

  /* --- RETRO MYSPACE METALLIC PLAYER SKIN --- */
.sidebar-player {
    width: 380px;
    background: linear-gradient(to bottom, #f2f2f2 0%, #cccccc 50%, #aaaaaa 100%);
    border: 2px solid #555555;
    border-right-color: #ffffff;
    border-bottom-color: #ffffff;
    padding: 6px 12px;
    border-radius: 30px;
    box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 100;
    margin-top: 15px;
}

/* Beveled Play/Pause Frame Button */
.retro-play-container {
    width: 40px;
    height: 40px;
    background: linear-gradient(to bottom, #ffffff 0%, #e0e0e0 40%, #b5b5b5 100%);
    border: 2px solid #ffffff;
    border-right-color: #777777;
    border-bottom-color: #777777;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: inset 1px 1px 1px #fff;
    flex-shrink: 0;
}

.retro-play-container:active {
    border: 2px solid #777777;
    border-right-color: #ffffff;
    border-bottom-color: #ffffff;
}

/* Vertical Twin Pause Bar Component */
.pause-icon {
    display: flex;
    gap: 4px;
}

.pause-bar {
    width: 4px;
    height: 14px;
    background: #555555;
    border-radius: 1px;
}

/* Styled Play Triangle Toggle */
.play-icon {
    width: 0;
    height: 0;
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
    border-left: 11px solid #555555;
    margin-left: 2px;
    display: none;
}

/* Black Digital Track Display Matrix */
.retro-display {
    flex-grow: 1;
    height: 40px;
    background: #111111;
    border: 2px solid #777777;
    border-right-color: #ffffff;
    border-bottom-color: #ffffff;
    border-radius: 20px;
    padding: 4px 12px;
    display: flex;
    justify-content: space-between;
    color: #ffffff;
    font-family: Arial, sans-serif;
    position: relative;
    overflow: hidden;
}

/* Marquee wrapper tracks for horizontal scrolling text streams */
.track-metadata {
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: 60%;
    overflow: hidden;
    white-space: nowrap;
}

/* Infinite Horizontal Marquee Scroll Animation Rules */
.track-name {
    font-size: 0.7rem;
    font-weight: bold;
    color: #ffffff;
    letter-spacing: 0.5px;
    display: inline-block;
    padding-left: 100%;
    animation: sideMarquee 10s linear infinite;
}

.artist-name {
    font-size: 0.55rem;
    color: #cccccc;
    text-transform: uppercase;
    margin-top: 1px;
    display: inline-block;
    padding-left: 100%;
    animation: sideMarquee 10s linear infinite;
    animation-delay: 1.5s;
}

@keyframes sideMarquee {
    0% { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(-100%, 0, 0); }
}

/* Right Panel UI Hooks (+delete+ / +view+) */
.retro-actions-panel {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-end;
    font-size: 0.6rem;
    font-weight: bold;
    color: #ffffff;
    font-family: monospace;
    z-index: 2;
}

.action-tag {
    cursor: pointer;
    user-select: none;
}

.action-tag:hover {
    color: #d14702;
}

/* Audio Frequency Equalizer Bar Simulation */
.equalizer-box {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    position: absolute;
    bottom: 4px;
    right: 54px;
    height: 14px;
}

.eq-bar {
    width: 3px;
    height: 2px;
    background-color: #33cc33;
    transition: height 0.15s ease;
}

    /* --- MAIN LAYOUT SYSTEM STYLES --- */
    .wrapper {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(2, 160px);
        gap: 16px;
        justify-content: center;
    }

    .card {
        display: block;
        background: white;
        border: 2px solid black;
        padding: 10px;
        text-decoration: none;
        color: black;
        transition: .18s;
    }

    .card:hover {
        transform: translateY(-4px) scale(1.04);
        background: black;
        color: white;
        box-shadow: 6px 6px 0px rgba(0, 0, 0, .25);
    }

    .card img {
        width: 100%;
        height: 95px;
        object-fit: cover;
        border: 1px solid black;
        margin-bottom: 8px;
    }

    .card span {
        display: block;
        font-size: .8rem;
        letter-spacing: .2em;
        font-weight: bold;
    }

    .footer {
        margin-top: 15px;
        font-size: .75rem;
        letter-spacing: .2em;
        color: #000000;
        font-weight: bold;
        cursor: pointer;
        user-select: none;
    }

    /* --- RETRO TOP LOGO --- */
    .logo-container {
        width: 100%;
        text-align: center;
        margin-bottom: 15px;
        z-index: 10;
    }

    .main-logo {
        max-width: 140px;
        width: 100%;
        height: auto;
        display: inline-block;
        filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.15));
    }

    @media(max-width: 768px) {
        .sidebar-player {
            width: 320px;
        }
        .grid {
            grid-template-columns: repeat(2, 140px);
        }
    }
</style>
</head>

<body>

<!-- Main Logo Container -->
<div class="logo-container">
    <img src="22.png" alt="Skyytopia Logo" class="main-logo">
</div>

<div class="wrapper">
    <div class="grid">
        <!-- Box 1: Movies -->
        <a class="card" href="Mo0veez.html">
            <img src="giff.gif">
            <span>Mo0VEEZ</span>
        </a>

        <!-- Box 2: Photos -->
        <a class="card" href="https://flickr.com">
            <img src="SMILE, YOU'RE ON (2).png">
            <span>PICS</span>
        </a>

        <!-- Box 3: GTAV -->
        <a class="card" href="gtav.html">
            <img src="images/muzik.gif">
            <span>GTAV</span>
        </a>

        <!-- Box 4: Me -->
        <a class="card" href="Profile.html">
            <img src="images/profile.gif">
            <span>ME</span>
        </a>
    </div>

    <!-- Retro Player Structural Shell Container -->
    <div class="sidebar-player">
        <!-- Interactive Trigger Button -->
        <div class="retro-play-container" onclick="toggleAudio()">
            <div class="pause-icon" id="pauseBtnVisual">
                <div class="pause-bar"></div>
                <div class="pause-bar"></div>
            </div>
            <div class="play-icon" id="playBtnVisual"></div>
        </div>

        <!-- LCD Interface Matrix Display panel -->
        <div class="retro-display">
            <div class="track-metadata">
                <span class="track-name" id="trackNameDisplay">TRACK LOADING</span>
                <span class="artist-name" id="artistNameDisplay">ARTIST</span>
            </div>

            <!-- Equalizer node simulation overlay wrapper -->
            <div class="equalizer-box">
                <div class="eq-bar" id="eq1"></div>
                <div class="eq-bar" id="eq2"></div>
                <div class="eq-bar" id="eq3"></div>
                <div class="eq-bar" id="eq4"></div>
            </div>

            <div class="retro-actions-panel">
                <span class="action-tag" onclick="prevSong()">+prev+</span>
                <span class="action-tag" onclick="nextSong()">+next+</span>
            </div>
        </div>
    </div>

    <!-- Hidden Audio Engine Core -->
    <audio id="audioPlayer"></audio>

    <!-- Footer play hook tracker -->
    <div class="footer" onclick="toggleAudio()">
        © 2026 
    </div>
</div>

<script>
    const audioPlayer = document.getElementById('audioPlayer');
    const trackNameDisplay = document.getElementById('trackNameDisplay');
    const artistNameDisplay = document.getElementById('artistNameDisplay');
    const playVisual = document.getElementById('playBtnVisual');
    const pauseVisual = document.getElementById('pauseBtnVisual');

    // Formatted Array split precisely into distinct metadata fields
    const playlist = [
        { title: "Why Should I Be Sad", artist: "Britney Spears", url: "https://od.lk/s/OTBfNDMzODczOThf/Why%20Should%20I%20Be%20Sad.mp3" },
        { title: "Do It", artist: "Nelly Furtado", url: "https://od.lk/s/OTBfNDMzODczODhf/Nelly%20Furtado%20-%20Do%20It%20%28Official%20Music%20Video%29.mp3" },
        { title: "Gotta Get Thru This", artist: "Daniel Bedingfield", url: "https://od.lk/s/OTBfNTM0MTkyMzdfbkpyWWk/Daniel%20Bedingfield%20-%20Gotta%20Get%20Thru%20This%20%28Original%20Version%29%28TO%29.mp3" },
        { title: "Get Your Number", artist: "Mariah Carey", url: "https://od.lk/s/OTBfNDMzODczOTJf/Mariah%20Carey%20-%20Get%20Your%20Number.mp3" },
        { title: "Soft Spot", artist: "JMSN", url: "https://od.lk/s/OTBfNDMzODczOTlf/JMSN%20-%20Soft%20Spot%20%28Audio%29.mp3" },
        { title: "Glamorous", artist: "Fergie", url: "https://od.lk/s/OTBfNDMzODczOTVfcDFxSVg/Glamorous.mp3" },
        { title: "Do You Mind", artist: "Crazy Cousinz & Kyla Reid", url: "https://od.lk/s/OTBfNDMzODczOTNfNGZFV20/Do%20You%20Mind%20%28Crazy%20Cousinz%20Remix%29.mp3" },
        { title: "Yummy (Righteous Remix)", artist: "Ayesha Erotica", url: "https://od.lk/s/OTBfNDMzODczOTgetfYTN3TFY/ayesha%20x%20righteous.mp3" },
        { title: "9 AM in Calabasas", artist: "Ayesha Erotica", url: "https://od.lk/s/OTBfNDMzODczOTdfNnV0b0g/Ayesha%20erotica%20-%209%20am%20in%20calabasas%20%28remix%29%20%5Boriginal%20version%5D.mp3" },
        { title: "Someone To Call My Lover", artist: "Janet Jackson", url: "https://od.lk/s/OTBfNTM0MTkyODVfZ2pEVWU/Someone%20To%20Call%20My%20Lover%20%28Single%20Edit%29.mp3" },
        { title: "Clothes Off!!", artist: "Gym Class Heroes", url: "https://od.lk/s/OTBfNTUzNzE2ODlfS29mNGE/Clothes%20Off%21%21.mp3" },
        { title: "Me and You (MySpace version)", artist: "Cassie", url: "https://od.lk/s/OTBfNTM0MTkyMDNfbW1kSDI/Cassie-%20Me%20and%20You%20%28Rare%20Original%20MySpace%20Music%20Video%29.mp3" },
        { title: "Promiscuous", artist: "Nelly Furtado ft. Timbaland", url: "https://od.lk/s/OTBfNDQ2MzI4NDZfRHNseno/Nelly%20Furtado%20-%20Promiscuous%20%28Official%20Music%20Video%29%20ft.%20Timbaland.mp3" },
        { title: "Slow Down", artist: "Bobby Valentino", url: "https://od.lk/s/OTBfNDQ2MzI4ODBfYnB0UXc/Slow%20Down%20%28Radio%20Edit%29.mp3" },
        { title: "My Love ft, TI", artist: "Justin Timberlake", url: "https://od.lk/s/OTBfNDQ2ODU2NTVfOUxieWI/My%20Love.mp3" }
    ];

    let currentTrackIndex = 0;
    let isInitialized = false;
    let eqInterval = null;

    function updatePlayerUI() {
        trackNameDisplay.textContent = playlist[currentTrackIndex].title;
        artistNameDisplay.textContent = playlist[currentTrackIndex].artist;
    }

    updatePlayerUI();

    function toggleAudio() {
        if (!isInitialized) {
            audioPlayer.src = playlist[currentTrackIndex].url;
            audioPlayer.load();
            isInitialized = true;
        }

        if (audioPlayer.paused) {
            audioPlayer.play().then(() => {
                pauseVisual.style.display = 'flex';
                playVisual.style.display = 'none';
                startEqualizerSim();
            }).catch(error => {
                console.log("Stream initialize blockage caught:", error);
            });
        } else {
            audioPlayer.pause();
            pauseVisual.style.display = 'none';
            playVisual.style.display = 'block';
            stopEqualizerSim();
        }
    }

    function nextSong() {
        currentTrackIndex++;
        if (currentTrackIndex >= playlist.length) {
            currentTrackIndex = 0;
        }
        forceTrackPlayback();
    }

    function prevSong() {
        currentTrackIndex--;
        if (currentTrackIndex < 0) {
            currentTrackIndex = playlist.length - 1;
        }
        forceTrackPlayback();
    }

    function forceTrackPlayback() {
        audioPlayer.src = playlist[currentTrackIndex].url;
        updatePlayerUI();
        audioPlayer.load();
        audioPlayer.play().then(() => {
            pauseVisual.style.display = 'flex';
            playVisual.style.display = 'none';
            startEqualizerSim();
        }).catch(error => console.log(error));
        isInitialized = true;
    }

    function startEqualizerSim() {
        if(eqInterval) clearInterval(eqInterval);
        eqInterval = setInterval(() => {
            for (let i = 1; i <= 4; i++) {
                const bar = document.getElementById('eq' + i);
                const randomHeight = Math.floor(Math.random() * 12) + 2;
                bar.style.height = randomHeight + 'px';
                
                if (randomHeight > 10) {
                    bar.style.backgroundColor = '#ffcc00';
                } else {
                    bar.style.backgroundColor = '#33cc33';
                }
            }
        }, 120);
    }

    function stopEqualizerSim() {
        clearInterval(eqInterval);
        for (let i = 1; i <= 4; i++) {
            document.getElementById('eq' + i).style.height = '2px';
            document.getElementById('eq' + i).style.backgroundColor = '#33cc33';
        }
    }

    audioPlayer.addEventListener('ended', nextSong);

    pauseVisual.style.display = 'none';
    playVisual.style.display = 'block';
</script>
</body>
</html>
