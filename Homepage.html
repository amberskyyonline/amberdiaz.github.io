<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyytopia</title>
    <link rel="icon" href="favicon.png">
   <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #6c6b3f;
        font-family: Verdana, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    /* --- RETRO TOWER VERTICAL PLAYER SKIN --- */
    .sidebar-player {
        position: fixed;
        left: 25px;
        top: 50%;
        transform: translateY(-50%);
        width: 76px; /* Skinny tower width */
        height: 280px; /* Stretched tower height */
        background: linear-gradient(to right, #f2f2f2 0%, #cccccc 50%, #aaaaaa 100%);
        border: 2px solid #555555;
        border-right-color: #ffffff;
        border-bottom-color: #ffffff;
        padding: 8px;
        box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column; /* Stack components vertically */
        align-items: center;
        gap: 10px;
        z-index: 100;
    }

    /* Beveled Play/Pause Frame Button sitting on top */
    .retro-play-container {
        width: 48px;
        height: 48px;
        background: linear-gradient(to bottom, #ffffff 0%, #e0e0e0 40%, #b5b5b5 100%);
        border: 2px solid #ffffff;
        border-right-color: #777777;
        border-bottom-color: #777777;
        border-radius: 6px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        box-shadow: inset 1px 1px 1px #fff;
        flex-shrink: 0;
    }

    .retro-play-container:active {
        border: 2px solid #777777;
        border-right-color: #ffffff;
        border-bottom-color: #ffffff;
    }

    .pause-icon {
        display: flex;
        gap: 5px;
    }

    .pause-bar {
        width: 5px;
        height: 18px;
        background: #555555;
        border-radius: 1px;
    }

    .play-icon {
        width: 0;
        height: 0;
        border-top: 9px solid transparent;
        border-bottom: 9px solid transparent;
        border-left: 14px solid #555555;
        margin-left: 3px;
        display: none;
    }

    /* Tall Black Digital Tower Screen Display Matrix */
    .retro-display {
        width: 100%;
        flex-grow: 1;
        background: #111111;
        border: 2px solid #777777;
        border-right-color: #ffffff;
        border-bottom-color: #ffffff;
        border-radius: 4px;
        padding: 8px 4px;
        display: flex;
        flex-direction: column; /* Stacks text settings above visualizer */
        justify-content: space-between;
        align-items: center;
        color: #ffffff;
        font-family: Arial, sans-serif;
        position: relative;
        overflow: hidden;
    }

    .track-metadata {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        text-align: center;
        margin-top: 4px;
    }

    .track-name {
        font-size: 0.65rem;
        font-weight: bold;
        width: 52px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #ffffff;
        letter-spacing: 0.5px;
    }

    .artist-name {
        font-size: 0.55rem;
        color: #cccccc;
        text-transform: uppercase;
        width: 52px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 3px;
    }

    /* Actions stacked horizontally at the middle-bottom */
    .retro-actions-panel {
        display: flex;
        justify-content: space-between;
        width: 100%;
        padding: 0 4px;
        font-size: 0.55rem;
        font-weight: bold;
        color: #ffffff;
        font-family: monospace;
        margin-bottom: 24px; /* Leaves clear space for the EQ bars beneath */
    }

    .action-tag {
        cursor: pointer;
        user-select: none;
    }
    .action-tag:hover {
        color: #d14702;
    }

    /* Audio Frequency Equalizer pinned to the absolute bottom of the tower screen */
    .equalizer-box {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 3px;
        position: absolute;
        bottom: 6px;
        left: 0;
        right: 0;
        height: 22px;
        width: 100%;
    }

    .eq-bar {
        width: 5px;
        height: 2px;
        background-color: #33cc33;
        transition: height 0.15s ease;
    }

    /* --- MAIN LAYOUT SYSTEM STYLES --- */
    .wrapper {
        text-align: center;
        margin-left: 90px; /* Lower margin since the tower player is narrower than the wide one */
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(2, 180px);
        gap: 22px;
        justify-content: center;
    }

    .card {
        display: block;
        background: white;
        border: 2px solid black;
        padding: 14px;
        text-decoration: none;
        color: black;
        transition: .18s;
    }

    .card:hover {
        transform: translateY(-4px) scale(1.04);
        background: black;
        color: white;
        box-shadow: 8px 8px 0px rgba(0, 0, 0, .25);
    }

    .card img {
        width: 100%;
        height: 120px;
        object-fit: cover;
        border: 1px solid black;
        margin-bottom: 12px;
    }

    .card span {
        display: block;
        font-size: .85rem;
        letter-spacing: .25em;
        font-weight: bold;
    }

    .footer {
        margin-top: 35px;
        font-size: .75rem;
        letter-spacing: .2em;
        color: #666;
        cursor: pointer;
        user-select: none;
    }

    @media(max-width: 768px) {
        body {
            flex-direction: column;
            overflow-y: auto;
            padding: 20px 0;
        }
        .sidebar-player {
            position: static;
            transform: none;
            margin-bottom: 25px;
            flex-direction: row; /* Converts back to flat on narrow mobile screens so it fits */
            width: 320px;
            height: 64px;
        }
        .retro-display {
            flex-direction: row;
            height: 48px;
            padding: 4px 6px;
        }
        .track-metadata {
            align-items: flex-start;
            text-align: left;
            width: 60%;
        }
        .track-name, .artist-name {
            width: 100%;
        }
        .retro-actions-panel {
            flex-direction: column;
            width: auto;
            margin-bottom: 0;
            align-items: flex-end;
        }
        .equalizer-box {
            right: 58px;
            left: auto;
            bottom: 4px;
            width: auto;
            height: 16px;
        }
        .wrapper {
            margin-left: 0;
        }
    }
        /* --- MAIN SYSTEM LAYOUT STYLES --- */
        .wrapper {
            text-align: center;
            margin-left: 140px;
        }

        .grid {
            display: grid;

        }

        .card {

            padding: 14px;

            color: black;
            transition: .18s;
        }

        .card:hover {
            transform: translateY(-4px) scale(1.04);
            background: black;
            color: white;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, .25);
        }

        .card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border: 1px solid black;
            margin-bottom: 12px;
        }

        .card span {
            display: block;
            font-size: .85rem;
            letter-spacing: .25em;
            font-weight: bold;
        }

        .footer {
            margin-top: 35px;
            font-size: .75rem;
            letter-spacing: .2em;
            color: #666;
            cursor: pointer;
            user-select: none;
        }

        @media(max-width: 768px) {
            body {
                flex-direction: column;
                overflow-y: auto;
                padding: 20px 0;
            }
            .sidebar-player {
                position: static;
                transform: none;
                margin-bottom: 25px;
                width: 320px;
            }
            .wrapper {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

    <!-- Retro Player Structural Shell Container -->
    <div class="sidebar-player">
        <!-- Interactive Trigger Button -->
        <div class="retro-play-container" onclick="toggleAudio()">
            <div class="pause-icon" id="pauseBtnVisual">
                <div class="pause-bar"></div>
                <div class="pause-bar"></div>
            </div>
            <div class="play-icon" id="playBtnVisual"></div>
        </div>

        <!-- LCD Interface Matrix Display panel -->
        <div class="retro-display">
            <div class="track-metadata">
                <span class="track-name" id="trackNameDisplay">TRACK LOADING</span>
                <span class="artist-name" id="artistNameDisplay">ARTIST</span>
            </div>

            <!-- Equalizer node simulation overlay wrapper -->
            <div class="equalizer-box">
                <div class="eq-bar" id="eq1"></div>
                <div class="eq-bar" id="eq2"></div>
                <div class="eq-bar" id="eq3"></div>
                <div class="eq-bar" id="eq4"></div>
            </div>

            <div class="retro-actions-panel">
                <span class="action-tag" onclick="prevSong()">+prev+</span>
                <span class="action-tag" onclick="nextSong()">+next+</span>
            </div>
        </div>
    </div>

    <div class="wrapper">
        <div class="grid">
            <!-- Box 1: Movies -->
            <a class="card" href="Mo0veez.html">
                <img src="giff.gif">
                <span>Mo0VEEZ</span>
            </a>

            <!-- Box 2: Photos -->
            <a class="card" href="https://flickr.com">
                <img src="SMILE, YOU'RE ON (2).png">
                <span>PICS</span>
            </a>

            <!-- Box 3: GTAV -->
            <a class="card" href="gtav.html">
                <img src="images/muzik.gif">
                <span>GTAV</span>
            </a>

            <!-- Box 4: Me -->
            <a class="card" href="Profile.html">
                <img src="images/profile.gif">
                <span>ME</span>
            </a>
        </div>
    <!-- Hidden Audio Engine Core -->
    <audio id="audioPlayer"></audio>

    <!-- Footer play hook tracker -->
    <div class="footer" onclick="toggleAudio()">
        © 2026 • DON'T COPY AIGHT!!!!
    </div>
</div>

<script>
    const audioPlayer = document.getElementById('audioPlayer');
    const trackNameDisplay = document.getElementById('trackNameDisplay');
    const artistNameDisplay = document.getElementById('artistNameDisplay');
    const playVisual = document.getElementById('playBtnVisual');
    const pauseVisual = document.getElementById('pauseBtnVisual');

    // Formatted Array split precisely into distinct metadata fields
    const playlist = [
        { title: "Why Should I Be Sad", artist: "Britney Spears", url: "https://od.lk/s/OTBfNDMzODczOThf/Why%20Should%20I%20Be%20Sad.mp3" },
        { title: "Do It", artist: "Nelly Furtado", url: "https://od.lk/s/OTBfNDMzODczODhf/Nelly%20Furtado%20-%20Do%20It%20%28Official%20Music%20Video%29.mp3" },
        { title: "Gotta Get Thru This", artist: "Daniel Bedingfield", url: "https://od.lk/s/OTBfNTM0MTkyMzdfbkpyWWk/Daniel%20Bedingfield%20-%20Gotta%20Get%20Thru%20This%20%28Original%20Version%29%28TO%29.mp3" },
        { title: "Get Your Number", artist: "Mariah Carey", url: "https://od.lk/s/OTBfNDMzODczOTJf/Mariah%20Carey%20-%20Get%20Your%20Number.mp3" },
        { title: "Soft Spot", artist: "JMSN", url: "https://od.lk/s/OTBfNDMzODczOTlf/JMSN%20-%20Soft%20Spot%20%28Audio%29.mp3" },
        { title: "Glamorous", artist: "Fergie", url: "https://od.lk/s/OTBfNDMzODczOTVfcDFxSVg/Glamorous.mp3" },
        { title: "Do You Mind", artist: "Crazy Cousinz & Kyla Reid", url: "https://od.lk/s/OTBfNDMzODczOTNfNGZFV20/Do%20You%20Mind%20%28Crazy%20Cousinz%20Remix%29.mp3" },
        { title: "Yummy (Righteous Remix)", artist: "Ayesha Erotica", url: "https://od.lk/s/OTBfNDMzODczOTZfYTN3TFY/ayesha%20x%20righteous.mp3" },
        { title: "9 AM in Calabasas", artist: "Ayesha Erotica", url: "https://od.lk/s/OTBfNDMzODczOTdfNnV0b0g/Ayesha%20erotica%20-%209%20am%20in%20calabasas%20%28remix%29%20%5Boriginal%20version%5D.mp3" },
        { title: "Someone To Call My Lover", artist: "Janet Jackson", url: "https://od.lk/s/OTBfNTM0MTkyODVfZ2pEVWU/Someone%20To%20Call%20My%20Lover%20%28Single%20Edit%29.mp3" },
        { title: "Clothes Off!!", artist: "Gym Class Heroes", url: "https://od.lk/s/OTBfNTUzNzE2ODlfS29mNGE/Clothes%20Off%21%21.mp3" },
        { title: "Me and You (MySpace version)", artist: "Cassie", url: "https://od.lk/s/OTBfNTM0MTkyMDNfbW1kSDI/Cassie-%20Me%20and%20You%20%28Rare%20Original%20MySpace%20Music%20Video%29.mp3" },
        { title: "Promiscuous", artist: "Nelly Furtado ft. Timbaland", url: "od.lk" },
        { title: "Slow Down", artist: "Bobby Valentino", url: "https://od.lk/s/OTBfNDQ2MzI4ODBfYnB0UXc/Slow%20Down%20%28Radio%20Edit%29.mp3" },
        { title: "My Love ft, TI", artist: "Justin Timberlake", url: "https://od.lk/s/OTBfNDQ2ODU2NTVfOUxieWI/My%20Love.mp3" }
    ];

    let currentTrackIndex = 0;
    let isInitialized = false;
    let eqInterval = null;

    function updatePlayerUI() {
        trackNameDisplay.textContent = playlist[currentTrackIndex].title;
        artistNameDisplay.textContent = playlist[currentTrackIndex].artist;
    }

    // Initialize display text window
    updatePlayerUI();

    function toggleAudio() {
        if (!isInitialized) {
            audioPlayer.src = playlist[currentTrackIndex].url;
            audioPlayer.load();
            isInitialized = true;
        }

        if (audioPlayer.paused) {
            audioPlayer.play().then(() => {
                pauseVisual.style.display = 'flex';
                playVisual.style.display = 'none';
                startEqualizerSim();
            }).catch(error => {
                console.log("Stream initialize blockage caught:", error);
            });
        } else {
            audioPlayer.pause();
            pauseVisual.style.display = 'none';
            playVisual.style.display = 'block';
            stopEqualizerSim();
        }
    }

    function nextSong() {
        currentTrackIndex++;
        if (currentTrackIndex >= playlist.length) {
            currentTrackIndex = 0;
        }
        forceTrackPlayback();
    }

    function prevSong() {
        currentTrackIndex--;
        if (currentTrackIndex < 0) {
            currentTrackIndex = playlist.length - 1;
        }
        forceTrackPlayback();
    }

    function forceTrackPlayback() {
        audioPlayer.src = playlist[currentTrackIndex].url;
        updatePlayerUI();
        audioPlayer.load();
        audioPlayer.play().then(() => {
            pauseVisual.style.display = 'flex';
            playVisual.style.display = 'none';
            startEqualizerSim();
        }).catch(error => console.log(error));
        isInitialized = true;
    }

    // Generates active audio frequency calculations on rendering loop
    function startEqualizerSim() {
        if(eqInterval) clearInterval(eqInterval);
        eqInterval = setInterval(() => {
            for (let i = 1; i <= 4; i++) {
                const bar = document.getElementById('eq' + i);
                const randomHeight = Math.floor(Math.random() * 18) + 2;
                bar.style.height = randomHeight + 'px';
                
                // Switches matrix display color vectors cleanly dynamically
                if (randomHeight > 14) {
                    bar.style.backgroundColor = '#ffcc00'; // Peak warning color switch
                } else {
                    bar.style.backgroundColor = '#33cc33'; // Standard green spectrum vector
                }
            }
        }, 120);
    }

    function stopEqualizerSim() {
        clearInterval(eqInterval);
        for (let i = 1; i <= 4; i++) {
            document.getElementById('eq' + i).style.height = '2px';
            document.getElementById('eq' + i).style.backgroundColor = '#33cc33';
        }
    }

    audioPlayer.addEventListener('ended', nextSong);

    // Match player controls display accurately upon direct load sequence properties
    pauseVisual.style.display = 'none';
    playVisual.style.display = 'block';
</script>
